{% extends "hub/base.html" %}
{% block title %}Админ HUB — вход{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h1 class="h4 mb-2">Админ-панель HUB</h1>
        <p class="text-muted small mb-3">Роль администратора портала (отдельно от Django /admin/).</p>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Логин</label>
            <input type="text" name="login" class="form-control" value="{{ login_value|default:'' }}" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Пароль</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button class="btn btn-dark w-100" type="submit">Войти</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
